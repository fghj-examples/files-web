version: "2.0"

include:
  api: https://github.com/fghj-examples/files-api.git

services:
  web:
    build: .
    ports:
      "80":
        primary: true
    # The login callback registered with Descope is https://files.test/callback.
    # A name of our own stays the same whatever the workspace is called,
    # where the derived one changes with it.
    additional_hosts:
      - files.test
    environment:
      # nginx forwards /api/ here, so the browser only ever talks to one
      # origin: this one.
      # The http name, so these calls go through the sidecar and fghj can
      # record them in the api's Traffic tab. Plain http://: nginx doesn't
      # need TLS to get there.
      API_UPSTREAM: http://${FGHJ_SERVICE_FQDN_HTTP:api/api}
    depends_on:
      api: {}
